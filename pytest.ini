# Root pytest configuration.
#
# Running `pytest` from the repository root has to behave exactly like
# running it from `backend/`. Without this file pytest finds no
# configuration at all when it is started from the root: the rootdir
# becomes the repository root, no ini file is loaded, and pytest-asyncio
# falls back to "strict" mode. In strict mode the async fixtures that
# the test modules declare with a plain `@pytest.fixture` are never
# awaited, and eighteen tests fail with
# `TypeError: 'coroutine' object is not subscriptable`.
#
# Those failures are an artefact of where the command was run, not a
# broken suite — but they look exactly like a broken suite, which is
# worse. CI runs the suite with `working-directory: backend`, where
# `backend/pytest.ini` applies; this file makes the root behave the
# same way.
#
# The settings below are deliberately identical to `backend/pytest.ini`.
# Keep the two in step.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = backend/app/tests
python_files = test_*.py
addopts = -v --tb=short -p no:cacheprovider
